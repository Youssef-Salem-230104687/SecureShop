{% extends 'base.html' %}{% block content %}<a class="link-secondary small" href="{{ url_for('admin') }}">← Dashboard</a><h1>Manage users</h1><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>User</th><th>Role</th><th>Credit</th><th>Verified</th><th></th></tr></thead><tbody>{% for u in users %}<tr><form method="post" action="{{ url_for('admin_user_update',user_id=u.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><!-- [VULNERABILITY: STORED XSS] Username rendered without escaping via |safe filter --><td><strong>{{ u.username|safe }}</strong><br><small class="text-secondary">{{ u.email }}</small></td><td><select class="form-select form-select-sm" name="role"><option value="user" {% if u.role == 'user' %}selected{% endif %}>User</option><option value="admin" {% if u.role == 'admin' %}selected{% endif %}>Admin</option></select></td><td><input class="form-control form-control-sm" type="number" min="0" step=".01" name="store_credit" value="{{ u.store_credit }}"></td><td><input class="form-check-input" type="checkbox" name="is_verified" {% if u.is_verified %}checked{% endif %}></td><td><button class="btn btn-sm btn-primary">Save</button></td></form></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
