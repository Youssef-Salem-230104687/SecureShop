{% extends 'base.html' %}{% block content %}<div class="form-shell"><span class="eyebrow">JOIN SECURESHOP</span><h1>Create account</h1><p class="text-secondary">Get store credit and track every order in one place.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label class="form-label">Username</label><input class="form-control mb-3" name="username" required minlength="3" maxlength="32" autocomplete="username"><label class="form-label">Email address</label><input class="form-control mb-3" type="email" name="email" required autocomplete="email"><label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" required minlength="10" autocomplete="new-password"><button class="btn btn-primary w-100">Create account</button></form></div>{% endblock %}
