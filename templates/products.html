{% extends 'base.html' %}{% block content %}<h1>Products</h1><form class="input-group mb-4"><input class="form-control" name="q" value="{{query}}" placeholder="Search products"><button class="btn btn-primary">Search</button></form><div class="row">{% for p in products %}<div class="col-md-4"><div class="card mb-3"><div class="card-body"><h5>{{p.name}}</h5><p>{{p.description}}</p><p>${{'%.2f'|format(p.price)}} · {{p.stock}} in stock</p><a href="{{url_for('product_detail',product_id=p.id)}}" class="btn btn-primary">Details</a></div></div></div>{% else %}<p>No products found.</p>{% endfor %}</div>{% endblock %}
