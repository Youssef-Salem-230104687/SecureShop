{% extends 'base.html' %}{% block content %}<div class="form-shell"><span class="eyebrow">WELCOME BACK</span><h1>Sign in</h1><p class="text-secondary">Access your orders, credit, and account settings.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label class="form-label">Username</label><input class="form-control mb-3" name="username" autocomplete="username" required autofocus><label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" autocomplete="current-password" required><button class="btn btn-primary w-100">Sign in</button></form><p class="text-secondary small mt-3">New here? <a href="{{ url_for('register') }}">Create an account</a>.</p></div>{% endblock %}
