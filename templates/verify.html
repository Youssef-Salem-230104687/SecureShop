{% extends 'base.html' %}{% block content %}<div class="form-shell"><span class="eyebrow">ACCOUNT ACTIVATION</span><h1>Confirm your account</h1><p class="text-secondary">Enter the confirmation code that was issued for your account.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label class="form-label">Email address</label><input class="form-control mb-3" type="email" name="email" value="{{ email }}" required><label class="form-label">Confirmation code</label><input class="form-control mb-4" name="code" required autocomplete="one-time-code"><button class="btn btn-primary w-100">Confirm account</button></form></div>{% endblock %}
