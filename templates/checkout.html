{% extends 'base.html' %}{% block content %}<h1>Checkout</h1><form method="post"><p>Displayed total: ${{'%.2f'|format(total)}}</p>{% for p,q in items %}<input type="hidden" name="price_{{p.id}}" value="{{p.price}}">{% endfor %}<input type="text" class="form-control mb-2" name="total" value="{{'%.2f'|format(total)}}" placeholder="Total"><input type="text" class="form-control mb-2" name="coupon" placeholder="Coupon code"><button class="btn btn-primary">Place order</button></form>{% endblock %}
