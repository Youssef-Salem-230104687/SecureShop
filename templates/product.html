{% extends 'base.html' %}{% block content %}<h1>{{product.name}}</h1><p>{{product.description}}</p><h3>${{'%.2f'|format(product.price)}}</h3><form method="post" action="{{url_for('cart_add')}}" class="mb-4"><input type="hidden" name="product_id" value="{{product.id}}"><input class="form-control w-25 d-inline" type="number" name="quantity" value="1"><button class="btn btn-success">Add to cart</button></form>{% if current_user %}<form method="post" action="{{url_for('review',product_id=product.id)}}"><textarea class="form-control" name="body" placeholder="Write a review"></textarea><button class="btn btn-secondary mt-2">Post review</button></form>{% endif %}<hr><h3>Reviews</h3>{% for r in reviews %}<div class="border rounded p-2 mb-2"><b>{{r.username or 'Guest'}}</b><div>{{r.body|safe}}</div></div>{% else %}<p>No reviews yet.</p>{% endfor %}{% endblock %}
