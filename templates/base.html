<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SecureShop</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><nav class="navbar navbar-dark bg-dark navbar-expand"><div class="container"><a class="navbar-brand" href="{{ url_for('index') }}">SecureShop</a><div class="navbar-nav"><a class="nav-link" href="{{ url_for('products') }}">Products</a><a class="nav-link" href="{{ url_for('cart') }}">Cart ({{ cart_count }})</a>{% if current_user %}<a class="nav-link" href="{{ url_for('orders') }}">Orders</a><a class="nav-link" href="{{ url_for('profile') }}">Profile</a><a class="nav-link" href="{{ url_for('logout') }}">Logout</a>{% else %}<a class="nav-link" href="{{ url_for('login') }}">Login</a><a class="nav-link" href="{{ url_for('register') }}">Register</a>{% endif %}</div></div></nav><main class="container py-4">{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="alert alert-{{cat}}">{{msg}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
