{% extends 'base.html' %}{% block content %}<div class="p-5 mb-4 bg-light rounded-3"><h1>Welcome to SecureShop</h1><p>Everyday products for your digital workspace.</p><a class="btn btn-primary" href="{{url_for('products')}}">Browse products</a></div><div class="row">{% for p in products[:3] %}<div class="col-md-4"><div class="card mb-3"><div class="card-body"><h5>{{p.name}}</h5><p>{{p.description}}</p><strong>${{'%.2f'|format(p.price)}}</strong><a class="btn btn-outline-primary float-end" href="{{url_for('product_detail',product_id=p.id)}}">View</a></div></div></div>{% endfor %}</div>{% endblock %}
