{% extends 'base.html' %}{% block content %}<a class="link-secondary small" href="{{ url_for('admin') }}">← Dashboard</a><h1>Manage coupons</h1><div class="card border-0 shadow-sm mb-4"><div class="card-body"><h2 class="h5">Create coupon</h2><form method="post" class="row g-2"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="col-md-2"><input class="form-control" name="code" placeholder="CODE10" required></div><div class="col-4 col-md-2"><input class="form-control" type="number" min="1" max="100" name="discount" placeholder="% off" required></div><div class="col-md-3"><input class="form-control" type="email" name="email" placeholder="Assigned email (optional)"></div><div class="col-4 col-md-2"><input class="form-control" type="datetime-local" name="expires_at"></div><div class="col-4 col-md-1"><input class="form-control" type="number" min="1" name="max_uses" value="1"></div><div class="col-md-2"><button class="btn btn-primary w-100">Create</button></div></form></div></div><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Code</th><th>Discount</th><th>Uses</th><th>Assigned to</th><th>Expiry</th><th></th></tr></thead><tbody>{% for c in coupons %}<tr><form method="post" action="{{ url_for('admin_coupon_update',coupon_id=c.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><td><input class="form-control form-control-sm" name="code" value="{{ c.code }}"></td><td><input class="form-control form-control-sm" type="number" min="1" max="100" name="discount" value="{{ c.discount_percent }}"></td><td>{{ c.usage_count }}/<input class="form-control form-control-sm d-inline-block" style="width:65px" type="number" min="1" name="max_uses" value="{{ c.max_uses }}"></td><td><input class="form-control form-control-sm" type="email" name="email" value="{{ c.assigned_email }}"></td><td><input class="form-control form-control-sm" type="datetime-local" name="expires_at" value="{{ c.expires_at[:16] if c.expires_at else '' }}"></td><input type="hidden" name="min_purchase" value="{{ c.min_purchase }}"><td class="text-nowrap"><button class="btn btn-sm btn-primary">Save</button></form><form method="post" action="{{ url_for('admin_coupon_delete',coupon_id=c.id) }}" class="d-inline"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn btn-sm btn-outline-danger" onclick="return confirm('Remove this coupon?')">Delete</button></form></td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
