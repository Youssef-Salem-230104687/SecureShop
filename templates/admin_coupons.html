{% extends 'base.html' %}{% block content %}<h1>Manage coupons</h1><form method="post" class="row g-2 mb-3"><input class="form-control" name="code" placeholder="Code"><input class="form-control" name="discount" placeholder="Discount %"><input class="form-control" name="email" placeholder="Assigned email"><button class="btn btn-primary">Create</button></form>{% for c in coupons %}<p>{{c.code}} — {{c.discount_percent}}%</p>{% endfor %}{% endblock %}
