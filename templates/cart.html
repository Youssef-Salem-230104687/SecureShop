{% extends 'base.html' %}{% block content %}<h1>Your cart</h1>{% if items %}<form method="post" action="{{url_for('cart_update')}}">{% for p,q in items %}<div class="row align-items-center border-bottom py-2"><div class="col">{{p.name}} (${{p.price}})</div><div class="col"><input class="form-control" name="qty_{{p.id}}" value="{{q}}"></div><div class="col">${{'%.2f'|format(p.price*q)}}</div></div>{% endfor %}<button class="btn btn-secondary mt-3">Update cart</button></form><a class="btn btn-success mt-3" href="{{url_for('checkout')}}">Checkout</a>{% else %}<p>Your cart is empty.</p>{% endif %}{% endblock %}
