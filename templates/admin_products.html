{% extends 'base.html' %}{% block content %}<h1>Manage products</h1><form method="post" class="row g-2 mb-3"><input class="form-control" name="name" placeholder="Name"><input class="form-control" name="description" placeholder="Description"><input class="form-control" name="price" placeholder="Price"><input class="form-control" name="stock" placeholder="Stock"><button class="btn btn-primary">Add</button></form>{% for p in products %}<p>{{p.name}} — ${{p.price}}</p>{% endfor %}{% endblock %}
