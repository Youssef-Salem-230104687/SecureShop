{% extends 'base.html' %}{% block content %}<a class="link-secondary small" href="{{ url_for('admin') }}">← Dashboard</a><h1>Manage products</h1><div class="card border-0 shadow-sm mb-4"><div class="card-body"><h2 class="h5">Add product</h2><form method="post" class="row g-2"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="col-md-3"><input class="form-control" name="name" placeholder="Name" required></div><div class="col-md-3"><input class="form-control" name="description" placeholder="Description" required></div><div class="col-4 col-md-2"><input class="form-control" type="number" min="0" step=".01" name="price" placeholder="Price" required></div><div class="col-4 col-md-2"><input class="form-control" type="number" min="1" name="stock" placeholder="Stock" required></div><div class="col-4 col-md-2"><button class="btn btn-primary w-100">Add product</button></div></form></div></div><div class="accordion" id="products">{% for p in products %}<div class="accordion-item"><h2 class="accordion-header"><button class="accordion-button collapsed" data-bs-toggle="collapse" data-bs-target="#p{{ p.id }}">{{ p.name }} <span class="ms-auto me-3 text-secondary small">&dollar;{{ '%.2f'|format(p.price) }} · {{ p.stock }} stock</span></button></h2><div id="p{{ p.id }}" class="accordion-collapse collapse"><div class="accordion-body"><form method="post" action="{{ url_for('admin_product_update',product_id=p.id) }}" class="row g-2"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="col-md-3"><input class="form-control" name="name" value="{{ p.name }}" required></div><div class="col-md-3"><input class="form-control" name="description" value="{{ p.description }}" required></div><div class="col-4 col-md-2"><input class="form-control" type="number" min="0" step=".01" name="price" value="{{ p.price }}" required></div><div class="col-4 col-md-2"><input class="form-control" type="number" min="1" name="stock" value="{{ p.stock }}" required></div><div class="col-4 col-md-2"><button class="btn btn-primary w-100">Save</button></div></form><form method="post" action="{{ url_for('admin_product_delete',product_id=p.id) }}" class="mt-2"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn btn-sm btn-outline-danger" onclick="return confirm('Remove this product?')">Remove product</button></form></div></div></div>{% endfor %}</div>{% endblock %}
